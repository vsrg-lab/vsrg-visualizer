server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates upstream. An absolute redirect would carry "http" and this container's own host:port
    # -- under cloudflared htat is a docker service name the browser can never reach.
    absolute_redirect off;
    port_in_redirect off;

    gzip_static on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # No SPA fallback: the app has no router, so an unknown path is a real 404.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ @root;
    }

    location @root {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 302 /;
    }
}
